name: Deploy to environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        type: choice
        required: true
        options:
          - dev
          - test
        default: 'dev'
      image_tag:
        description: Optional image tag to deploy. If left blank, a new image will be built, pushed and deployed
        required: false
        default: ''
        type: string

env:
  dev: 'playwright-action.yml'
  test: 'playwright-action-test.yml'

permissions:
  contents: read
  packages: write

jobs:
  deploy_to_env:
    uses: ministryofjustice/hmpps-assess-risks-and-needs-github-actions/.github/workflows/deploy_to_env.yml@v1
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      image_tag: ${{ inputs.image_tag }}
  int_test:
    needs: deploy_to_env
    secrets: inherit
    uses: ./.github/workflows/int_test.yml
    with:
      environment: ${{ inputs.environment }}
  e2e_tests:
    needs: deploy_to_env
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/run_e2e_test.yml
    with:
      environment: ${{ inputs.environment }}
