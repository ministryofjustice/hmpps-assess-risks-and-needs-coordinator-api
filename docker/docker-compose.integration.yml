services:
  int:
    image: ghcr.io/ministryofjustice/hmpps-assess-risks-and-needs-coordinator-api:local
    build:
      target: development
    command: gradle --parallel --build-cache --configuration-cache --info cleanTest test
    volumes:
      - ..:/app
      - ./.gradle:/home/gradle/.gradle
    environment:
      - AAP_CLIENT_ID
      - AAP_CLIENT_SECRET

volumes:
  .gradle:
  build:
