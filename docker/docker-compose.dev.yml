services:
  coordinator-api:
    image: ghcr.io/ministryofjustice/hmpps-assess-risks-and-needs-coordinator-api:local
    build:
      target: development
    command: gradle --parallel --build-cache --configuration-cache bootRun
    ports:
      - "5007:5005"
    volumes:
      - ..:/app
      - ./.gradle:/home/gradle/.gradle
    environment:
      SPRING_PROFILES_ACTIVE: local
