info.app:
  name: HMPPS ARNS Coordinator API
  version: 1.0

spring:
  application:
    name: hmpps-assess-risks-and-needs-coordinator-api

  http:
    codecs:
      max-in-memory-size: 10MB

  datasource:
    url: jdbc:postgresql://${app.db.endpoint}/${app.db.name}?currentSchema=${app.db.schema.name}&stringtype=unspecified
    username: ${app.db.username:root}
    password: ${app.db.password:dev}
    driver-class-name: org.postgresql.Driver

  flyway:
    schemas: ${app.db.schema.name:coordinator}
    locations: classpath:/db/migration
    enabled: true
    validate-on-migrate: true

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${app.services.hmpps-auth.base-url}/.well-known/jwks.json

      client:
        provider:
          hmpps-auth:
            token-uri: ${app.services.hmpps-auth.base-url}/oauth/token

        registration:
          coordinator-api:
            provider: hmpps-auth
            client-id: ${app.client.id}
            client-secret: ${app.client.secret}
            authorization-grant-type: client_credentials
            scope:
              - read
              - write

  web:
    error:
      include-message: always

app:
  services:
    hmpps-auth:
      base-url: ${hmpps-auth.base-url}
    aap-api:
      base-url: ${aap-api.base-url}
  self:
    endpoints:
      oasys: /oasys
  events:
    enabled: true
  db:
    name: postgres
    endpoint: localhost:5432
    schema:
      name: coordinator
    username: root
    password: dev
  client:
    id: ${CLIENT_ID}
    secret: ${CLIENT_SECRET}
  historical-events:
    enabled: ${HISTORICAL_EVENTS_ENABLED:false}

api:
  health-timeout: 2s
  timeout: 5s
  retry:
    max-retries: 2
    min-backoff: 250ms

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

hmpps:
  sqs:
    queues:
      coordinator:
        queue-name: ${HMPPS_SQS_QUEUES_COORDINATOR_QUEUE_NAME:coordinator-queue}
        error-visibility-timeout: 30
